<form class="form-card" method="post"><label>Name<input name="name" required value="{{ request.form.get('name', item.name if item else '') }}"></label><label>Description<textarea name="description">{{ request.form.get('description', item.description if item else '') }}</textarea></label><label>Category<input name="category" required value="{{ request.form.get('category', item.category if item else '') }}"></label><label>Price<input type="number" min="0" step="0.01" name="price" required value="{{ request.form.get('price', item.price if item else '') }}"></label><label class="check"><input type="checkbox" name="available" {% if request.form.get('available') or (not request.form and (not item or item.available)) %}checked{% endif %}> Available to order</label><button class="button">Save item</button></form>
